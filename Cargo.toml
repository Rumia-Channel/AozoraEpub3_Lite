[package]
name = "aozora_epub3_lite"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Aozora Bunko text to EPUB 3 converter (Rust lightweight port of AozoraEpub3)"

[lib]
name = "aozora_epub3_lite"

[[bin]]
name = "AozoraEpub3_Lite"
path = "src/main.rs"

[dependencies]
zip = { version = "6.0", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
md5 = "0.8"
